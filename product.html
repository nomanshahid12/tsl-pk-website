<style>
  .pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;}
  .pd-main-media{width:100%;aspect-ratio:4/3;border-radius:16px;border:1px solid var(--border);overflow:hidden;background:var(--card);}
  .pd-main-media img, .pd-main-media video{width:100%;height:100%;object-fit:cover;display:block;}
  .pd-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .pd-thumb{
    width:76px;height:76px;border-radius:10px;overflow:hidden;cursor:pointer;
    border:2px solid var(--border);position:relative;flex-shrink:0;
  }
  .pd-thumb.active{border-color:var(--accent);}
  .pd-thumb img, .pd-thumb video{width:100%;height:100%;object-fit:cover;}
  .pd-thumb .vid-badge{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,0.65);color:#fff;font-size:0.65rem;padding:1px 5px;border-radius:4px;}
  .pd-title{font-size:2rem;font-weight:900;margin:0 0 10px;}
  .pd-price{font-size:1.8rem;color:var(--accent2);font-weight:800;margin-bottom:18px;}
  .pd-desc{color:var(--text-dim);line-height:1.8;margin-bottom:26px;}
  @media(max-width:800px){.pd-grid{grid-template-columns:1fr;}}
</style>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const product = getProducts().find(p=>p.id===id);
  const el = document.getElementById('pdContent');
  if(!product){
    el.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);">Product not found. <a href="products.html" style="color:var(--accent2);">Back to products</a></p>`;
  } else {
    const media = [
      ...product.images.map(url=>({type:'image', url})),
      ...product.videos.map(url=>({type:'video', url}))
    ];
    if(media.length===0) media.push({type:'image', url:''});

    el.innerHTML = `
      <div>
        <div class="pd-main-media" id="pdMainMedia"></div>
        <div class="pd-thumbs" id="pdThumbs"></div>
      </div>
      <div>
        <span class="badge" style="position:static;display:inline-block;margin-bottom:14px;">${product.category}</span>
        <h1 class="pd-title">${product.title}</h1>
        <div class="pd-price">${fmtPrice(product.price)}</div>
        <p class="pd-desc">${product.description}</p>
        <div class="hero-actions">
          <button class="btn btn-accent" onclick='openOrderModal(${JSON.stringify(product)})'>🛒 Order Now</button>
          <a href="#" class="btn btn-whatsapp" onclick="genericWhatsapp();return false;">💬 Ask on WhatsApp</a>
        </div>
      </div>
    `;

    function showMedia(index){
      const m = media[index];
      const mainEl = document.getElementById('pdMainMedia');
      mainEl.innerHTML = m.type==='video'
        ? `<video src="${m.url}" controls autoplay muted></video>`
        : `<img src="${m.url}" alt="${product.title}">`;
      document.querySelectorAll('.pd-thumb').forEach((t,i)=>t.classList.toggle('active', i===index));
    }

    document.getElementById('pdThumbs').innerHTML = media.map((m,i)=>`
      <div class="pd-thumb" data-index="${i}">
        ${m.type==='video' ? `<video src="${m.url}" muted></video><span class="vid-badge">▶</span>` : `<img src="${m.url}" alt="thumb">`}
      </div>
    `).join('');

    document.querySelectorAll('.pd-thumb').forEach(t=>{
      t.addEventListener('click', ()=> showMedia(parseInt(t.dataset.index)));
    });

    showMedia(0);
  }
</script>
